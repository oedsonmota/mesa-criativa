  }else if(v==='lista'){
    body=`<div class="card tblwrap" style="padding:6px"><table class="tbl"><thead><tr><th>Projeto</th><th>Cliente</th><th>Etapa</th><th>Prazo</th><th>Checklist</th><th class="r">Horas</th><th class="r">Valor</th></tr></thead><tbody>${list.sort((a,b)=>a.due.localeCompare(b.due)).map(p=>{const d=diff(p.due);const sev=p.stage==='Entregue'?'':d<0?'bad':d<=3?'warn':'';
      return `<tr data-act="openproj" data-id="${p.id}"><td><strong>${esc(p.title)}</strong><div class="small muted">${p.type}</div></td><td>${esc(cname(p.clientId))}</td><td><span class="pill ${p.stage==='Entregue'?'ok':''}">${p.stage}</span></td><td><span class="pill ${sev} g">${br(p.due)}</span></td><td style="min-width:120px"><div class="prog"><i style="width:${progress(p)}%"></i></div></td><td class="r num">${String(p.hours).replace('.',',')}h</td><td class="r num">${p.value?brl(p.value):'·'}</td></tr>`}).join('')}</tbody></table></div>`;
  }else{
    const start=-7,span=42;

function gAuth(prompt){const q={client_id:GCID,redirect_uri:GREDIR,response_type:'token',scope:GSCOPES,include_granted_scopes:'true',state:route||'hoje'};if(prompt)q.prompt=prompt;if(S.google&&S.google.email)q.login_hint=S.google.email;
  toast('Abrindo o Google…');setTimeout(()=>{location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams(q)},800);return new Promise(()=>{})}
async function gFetch(url,opt={},retry=true){if(!gReady())await gAuth('');
  const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+gTok.t,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401&&retry){gTok=null;await gAuth('');return gFetch(url,opt,false)}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error&&j.error.message||('erro '+r.status));return j}

  const j=await gFetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=500&timeMin=${a.toISOString()}&timeMax=${b.toISOString()}`);
  const evs=(j.items||[]).filter(e=>e.status!=='cancelled'&&e.start).map(e=>{const all=!e.start.dateTime;const st=all?null:new Date(e.start.dateTime),en=e.end&&e.end.dateTime?new Date(e.end.dateTime):null;

  S.events=S.events.filter(e=>!e.g).concat(evs);S.google.synced=Date.now();save();if(['hoje','agenda','integracoes'].includes(route))render();if(loud)toast(`${evs.length} compromissos trazidos da sua agenda`)}

  catch(e){toast('Não salvei no Google: '+e.message)}}
const GMIME=m=>/pdf/.test(m)?'pdf':/image/.test(m)?'img':/document/.test(m)?'doc':/spreadsheet/.test(m)?'sheet':/presentation/.test(m)?'slides':/folder/.test(m)?'pasta':/zip|compressed/.test(m)?'zip':/video/.test(m)?'vid':/illustrator|postscript/.test(m)?'ai':'arq';
function gDrivePicker(pid){layer(`<div class="overlay" data-act="closelayer"><div class="modal gpick"><div class="modal-h"><h3>Anexar do Google Drive</h3><button class="iconbtn" data-act="closelayer" aria-label="Fechar">${ic('x')}</button></div>

AFTER.documentos=()=>{
  const cur=S.docs.find(d=>d.id===S.ui.doc);if(!cur)return;const ed=$('#editor');

  ed.addEventListener('input',()=>{cur.content=ed.innerHTML;touch()});

  $('#docTitle').addEventListener('input',e=>{cur.title=e.target.value;touch();const b=$(`.docitem.on span`);if(b)b.textContent=cur.title});
  $('#docFolder').addEventListener('change',e=>{cur.folder=e.target.value;touch();render()});
  $('#docProj').addEventListener('change',e=>{cur.projectId=e.target.value||null;touch();toast('Documento ligado ao projeto')});
  $$('.fmt button').forEach(b=>b.addEventListener('mousedown',e=>{e.preventDefault();const f=b.dataset.fmt;ed.focus();
    if(f==='bold'||f==='italic')document.execCommand(f);

    cur.content=ed.innerHTML;touch()}));
};

/* ---- Financeiro ---- */
VIEWS.financeiro=()=>{
  const inM=(d,k=0)=>{const x=parse(d);const m=new Date(T0.getFullYear(),T0.getMonth()-k,1);return x.getMonth()===m.getMonth()&&x.getFullYear()===m.getFullYear()};
  const sum=(arr)=>arr.reduce((a,b)=>a+b.amount,0);
  const cm=S.fin.filter(f=>inM(f.date));
  const rec=sum(cm.filter(f=>f.type==='in'&&f.status==='pago')),arc=sum(S.fin.filter(f=>f.type==='in'&&f.status==='pendente'));
  const des=sum(cm.filter(f=>f.type==='out')),lucro=rec-sum(cm.filter(f=>f.type==='out'&&f.status==='pago'));
  const months=[5,4,3,2,1,0].map(k=>{const ms=S.fin.filter(f=>inM(f.date,k));const m=new Date(T0.getFullYear(),T0.getMonth()-k,1);return {l:MESES[m.getMonth()],i:sum(ms.filter(f=>f.type==='in'&&f.status==='pago')),o:sum(ms.filter(f=>f.type==='out'&&f.status==='pago')),cur:k===0}});
  const max=Math.ceil(Math.max(...months.map(m=>Math.max(m.i,m.o)))/5000)*5000||5000;
  const W=600,H=230,pl=48,pb=26,pt=12,cw=(W-pl)/6,bw=Math.min(28,cw/3.2);
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  const ticks=[0,max/2,max];
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Entradas e saídas dos últimos 6 meses">
    ${ticks.map(t=>`<line class="gl" x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t>=1000?(t/1000)+' mil':t}</text>`).join('')}
    ${months.map((m,i)=>{const x=pl+cw*i+cw/2;return `<rect x="${x-bw-2}" y="${y(m.i)}" width="${bw}" height="${H-pb-y(m.i)}" rx="4" fill="${m.cur?'var(--accent)':'var(--ink)'}"><title>Entradas ${brl(m.i)}</title></rect><rect x="${x+2}" y="${y(m.o)}" width="${bw}" height="${H-pb-y(m.o)}" rx="4" fill="var(--line)"><title>Saídas ${brl(m.o)}</title></rect><text x="${x}" y="${H-8}" text-anchor="middle" style="${m.cur?'fill:var(--ink);font-weight:700':''}">${m.l}</text>`}).join('')}
  </svg>`;
  const ff=S.ui.finFilter;
  const rows=S.fin.filter(f=>ff==='todos'?inM(f.date)||f.status==='pendente':ff==='entradas'?f.type==='in'&&(inM(f.date)||f.status==='pendente'):ff==='saidas'?f.type==='out'&&inM(f.date):f.status==='pendente').sort((a,b)=>a.date.localeCompare(b.date));
  const cats={};cm.filter(f=>f.type==='out').forEach(f=>cats[f.cat]=(cats[f.cat]||0)+f.amount);
  return `<div class="tiles"><div class="tile hl"><div class="k">Recebido em ${MESES[T0.getMonth()]}</div><div class="v num">${brl(rec)}</div><div class="d">só conta o que caiu na conta</div></div><div class="tile"><div class="k">A receber</div><div class="v num">${brl(arc)}</div><div class="d">${S.fin.filter(f=>f.type==='in'&&f.status==='pendente').length} parcelas abertas</div></div><div class="tile"><div class="k">Despesas do mês</div><div class="v num">${brl(des)}</div><div class="d">${Object.keys(cats).length} categorias</div></div><div class="tile"><div class="k">Sobra do mês até agora</div><div class="v num" style="color:${lucro>=0?'var(--ok)':'var(--bad)'}">${brl(lucro)}</div><div class="d">recebido menos despesas pagas</div></div></div>
  <div class="fin-grid"><section class="card"><div class="card-h"><h3>Últimos 6 meses</h3><div class="sp"></div><div class="legend"><span><i style="background:var(--ink)"></i>Entradas</span><span><i style="background:var(--line)"></i>Saídas</span></div></div>${chart}</section>
  <section class="card"><div class="card-h"><h3>Para onde vai o dinheiro</h3></div><div class="list">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="li"><div class="grow"><div class="t">${esc(k)}</div><div class="prog" style="margin-top:6px"><i style="width:${v/des*100}%;background:var(--accent)"></i></div></div><span class="num">${brl(v)}</span></div>`).join('')}</div></section></div>
  <section class="card"><div class="toolbar" style="margin-bottom:10px"><h3 style="font-size:15px">Lançamentos</h3><div class="seg">${[['todos','Este mês'],['entradas','Entradas'],['saidas','Saídas'],['pendentes','Pendentes']].map(([k,l])=>`<button class="${ff===k?'on':''}" data-act="finfilter" data-v="${k}">${l}</button>`).join('')}</div><div class="sp"></div><button class="btn sm" data-act="sheets">${ic('upload')}Exportar para Google Sheets</button><button class="btn primary sm" data-act="new" data-k="entry">${ic('plus')}Lançamento</button></div>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Status</th><th class="r">Valor</th></tr></thead><tbody>${rows.map(f=>`<tr data-act="togglefin" data-id="${f.id}" title="Clique para marcar como ${f.status==='pago'?'pendente':'pago'}"><td class="num">${br(f.date)}</td><td><strong>${esc(f.desc)}</strong>${f.clientId?`<div class="small muted">${esc(cname(f.clientId))}</div>`:''}</td><td class="small">${esc(f.cat||'')}</td><td><span class="pill ${f.status==='pago'?'ok':diff(f.date)<0?'bad':'warn'}">${f.status==='pago'?'pago':diff(f.date)<0?'atrasado':'pendente'}</span></td><td class="r num" style="font-weight:700;color:${f.type==='in'?'var(--ink)':'var(--muted)'}">${f.type==='in'?'+':'−'} ${brl(f.amount)}</td></tr>`).join('')}</tbody></table></div>
  <p class="small muted" style="margin:10px 6px 0">Clique em um lançamento para marcar como pago. Uma venda só entra no recebido depois do pagamento confirmado.</p></section>`;
};

  <div class="toolbar"><div class="chips"><button class="chip ${!f?'on':''}" data-act="reftag" data-v="">Tudo</button>${tags.map(t=>`<button class="chip ${f===t?'on':''}" data-act="reftag" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div><div class="sp"></div><span class="small muted">Arraste imagens para cá</span></div>
  <div class="refs">${rs.map(r=>{let top='';

    else if(r.kind==='type')top=`<div class="specimen" style="font-family:${esc(r.font)}"><div class="big">${esc(r.sample)}</div><div class="abc">ABCDEFGHIJKLM abcdefghijklm 0123456789</div></div>`;
    else if(r.kind==='image')top=`<img src="${r.src}" alt="${esc(r.title)}">`;
    else top=`<div class="linkprev">${ic('link')}<span class="dom">${esc((r.url||'').replace(/^https?:\/\//,'').split('/')[0])}</span><span>${esc(r.note||'')}</span></div>`;
    return `<div class="ref">${top}<div class="body"><div class="row"><strong style="flex:1">${esc(r.title)}</strong>${r.url?`<a class="iconbtn" href="${esc(r.url)}" target="_blank" rel="noopener" aria-label="Abrir link">${ic('link')}</a>`:''}<button class="iconbtn" data-act="delref" data-id="${r.id}" aria-label="Apagar referência">${ic('trash')}</button></div><div class="tags">${r.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></div></div>`}).join('')}</div>`;
};
function lum(h){const n=parseInt(h.slice(1),16);const r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255;return .299*r+.587*g+.114*b}
let pendingImg=null;
AFTER.referencias=()=>{
  const drop=$('#drop');const fi=$('#refFile');
  const read=file=>{if(!file||!file.type.startsWith('image/'))return;const fr=new FileReader();fr.onload=()=>{shrink(fr.result,800).then(src=>{pendingImg=src;const t=drop.querySelector('[name=title]');if(!t.value)t.value=file.name.replace(/\.[^.]+$/,'');toast('Imagem pronta. Clique em Salvar.')})};fr.readAsDataURL(file)};
  fi.addEventListener('change',()=>read(fi.files[0]));
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();drop.classList.add('over')}}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('over')));
  drop.addEventListener('drop',e=>{if(e.dataTransfer.files.length){e.preventDefault();read(e.dataTransfer.files[0])}});
};
function shrink(src,max){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res(src);im.src=src})}

function detectTool(q){
  const low=q.toLowerCase();const who=S.clients.find(c=>low.includes(c.name.split(' ')[0].toLowerCase())||low.includes(c.company.toLowerCase().split(' ')[0]));
  const body=(q.match(/que (.+)$/i)||[,q])[1];
  const T=(k,app,action,detail,payload)=>{const m=MCPS.find(x=>x[0]===k);if(!S.mcp[k])return {off:m[1]};return {k,app:m[1],c:m[2],l:m[3],action,detail,payload,status:'pending'}};
  if(/slack/.test(low)){const ch=(who&&S.slack.channels.find(c=>c.id.startsWith(who.company.toLowerCase().split(' ')[0].normalize('NFD').replace(/[̀-ͯ]/g,''))))||S.slack.channels.find(c=>c.id==='equipe');const t=who?`${who.name.split(' ')[0]}, ${body}`:body.charAt(0).toUpperCase()+body.slice(1);return T('slack','Slack',`Enviar mensagem em #${ch.id}`,t,{ch:ch.id,t})}
  if(/whats|zap/.test(low)&&who){const i=S.whats.findIndex(w=>w.clientId===who.id);const t=`Oi, ${who.name.split(' ')[0]}! ${body.charAt(0).toUpperCase()+body.slice(1)}`;return T('whatsapp','WhatsApp',`Mandar mensagem para ${who.name}`,t,{i,clientId:who.id,t})}
  if(/marque|marca |agende|reuni|call/.test(low)){const d=/amanh/.test(low)?day(1):day(0);const hm=low.match(/(\d{1,2})h(\d{2})?/);const time=hm?`${hm[1].padStart(2,'0')}:${hm[2]||'00'}`:'10:00';const title=`Call com ${who?who.name+', '+who.company:'cliente'}`;return T('gcal','Google Agenda','Criar evento no Google Agenda',`${title} · ${relDay(d)} às ${time} · com link do Meet${who?' · convite para '+who.email:''}`,{title,date:d,time})}
  if(/drive|pasta/.test(low)){const p=who?S.projects.find(x=>x.clientId===who.id):null;return T('gdrive','Google Drive','Criar pasta no Google Drive',`Mesa Criativa / ${who?who.company:'Cliente'} / ${p?p.title:'Projeto'} / Entrega, com subpastas AI, PDF, PNG e SVG`,{})}
  if(/figma/.test(low))return T('figma','Figma','Comentar no arquivo do Figma',body,{});
  if(/canva/.test(low))return T('canva','Canva','Criar peça no Canva',body,{});
  return null;
}

const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

let wd=null;
const EASE='cubic-bezier(.32,.72,0,1)';
function wItems(g){return [...g.querySelectorAll(':scope>.w[data-w]')]}
/* FLIP: mede antes, muda, e anima cada bloco do lugar antigo para o novo */
function flip(grid,mutate,dur=420){const els=wItems(grid);const A=new Map(els.map(e=>[e,e.getBoundingClientRect()]));mutate();
  els.forEach(e=>e.getAnimations().forEach(x=>x.cancel()));
  els.forEach(e=>{const a=A.get(e),b=e.getBoundingClientRect();const dx=a.left-b.left,dy=a.top-b.top;if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
    if(reduceMotion())return;e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:dur,easing:EASE})})}
function wSaveOrder(grid){const ord=wItems(grid).map(e=>e.dataset.w);S.ui.layout.sort((x,y)=>ord.indexOf(x.id)-ord.indexOf(y.id));save()}
document.addEventListener('pointerdown',e=>{

    const prevMin=w.style.minHeight;w.style.minHeight='';const natural=w.getBoundingClientRect().height;w.style.minHeight=prevMin;

    wd={mode:'resize',w,grid,gap,colW:(gr.width-11*gap)/12,natural,guides:g,badge,it,span:it.w,rows:it.h||null};w.classList.add('resizing');document.body.classList.add('wbusy');wBadge();return}
  if(e.target.closest('button,a,input,textarea,select,label,[contenteditable],.chip,.ytplayer,.poster,.li,.mail,.note,.check,iframe'))return;
  if(!e.target.closest('.w-h')&&!w.classList.contains('bare'))return;

function wGhostLoop(){const d=wd;if(!d||d.mode!=='move')return;d.cx+=(d.tx-d.cx)*.38;d.cy+=(d.ty-d.cy)*.38;
  const vx=d.tx-d.cx;d.gh.style.transform=`translate3d(${d.cx}px,${d.cy}px,0) scale(1.03) rotate(${Math.max(-2,Math.min(2,vx*.04))}deg)`;d.raf=requestAnimationFrame(wGhostLoop)}

  if(!wd)return;

    const w=wd.w,r=w.getBoundingClientRect();const gh=w.cloneNode(true);gh.querySelectorAll('iframe').forEach(f=>f.remove());gh.classList.add('wghost');
    Object.assign(gh.style,{width:r.width+'px',height:r.height+'px',left:'0px',top:'0px',viewTransitionName:'none'});document.body.appendChild(gh);
    wd={mode:'move',w,grid:w.parentElement,gh,dx:wd.x0-r.left,dy:wd.y0-r.top,cx:r.left,cy:r.top,tx:r.left,ty:r.top,lock:0};
    w.classList.add('w-lifted');document.body.classList.add('wbusy','wgrabbing');requestAnimationFrame(()=>gh.classList.add('up'));wGhostLoop()}
  if(wd.mode==='move'){e.preventDefault();const d=wd;d.tx=e.clientX-d.dx;d.ty=e.clientY-d.dy;
    if(performance.now()<d.lock)return;
    const el=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.matches?.('.wgrid>.w[data-w]'));
    if(!el||el===d.w)return;const r=el.getBoundingClientRect();

function drawCmd(q,keep){

  const all=[...S.projects.map(p=>({g:'Projetos',l:p.title,s:cname(p.clientId)+' · '+p.stage,go:()=>{closeLayer();openProject(p.id)}})),
    ...S.clients.map(c=>({g:'Clientes',l:c.company,s:c.name+' · '+c.funil,go:()=>{closeLayer();openClient(c.id)}})),
    ...S.docs.map(d=>({g:'Documentos',l:d.title,s:d.folder,txt:d.content,go:()=>{closeLayer();S.ui.doc=d.id;location.hash='documentos';render()}})),
    ...S.notes.map(x=>({g:'Notas',l:x.title||x.body.slice(0,40),s:x.labels.join(', '),txt:x.body+(x.list||[]).map(i=>i.t).join(' '),go:()=>{closeLayer();location.hash='notas'}})),
    ...S.tasks.filter(t=>!t.done).map(t=>({g:'Tarefas',l:t.title,s:relDay(t.date),go:()=>{closeLayer();location.hash='hoje'}}))];
  cmdItems=Q?[...acts,...all].filter(i=>n(i.l+' '+i.s+' '+(i.txt||'').replace(/<[^>]+>/g,' ')).includes(Q)).slice(0,14):[...acts.slice(0,6),...all.filter(i=>i.g==='Projetos').slice(0,5)];
  let g='';$('#cmdlist').innerHTML=cmdItems.map((it,i)=>{const h=it.g!==g?`<div class="cmdgroup">${it.g}</div>`:'';g=it.g;return h+`<button class="cmd ${i===cmdSel?'on':''}" data-ci="${i}"><div><strong>${esc(it.l)}</strong>${it.s?`<div class="small muted">${esc(it.s)}</div>`:''}</div><span class="k">${i===cmdSel?'Enter':''}</span></button>`}).join('')||'<div class="empty" style="padding:12px">Nada encontrado com esse termo.</div>';
  $$('#cmdlist [data-ci]').forEach(b=>b.addEventListener('click',()=>cmdItems[+b.dataset.ci].go()));
  if(keep)$('#cmdlist .cmd.on')?.scrollIntoView({block:'nearest'});
}

  dayclick:(d,el,e)=>{if(e.target.closest('[data-act="openproj"]'))return;NEW.task({date:d.d})},
};

document.addEventListener('click',e=>{
  if(!e.target.closest('.newwrap'))$('#newpop')&&($('#newpop').hidden=true);
  if($('#side').classList.contains('open')&&!e.target.closest('#side')&&!e.target.closest('.menu-btn'))$('#side').classList.remove('open');
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='A'&&el.getAttribute('href')?.startsWith('#')&&el.dataset.act!=='opendoc')return;
  const fn=A[el.dataset.act];if(!fn)return;
  if(el.dataset.act==='closelayer'){fn(el.dataset,el,e);return}
  if(el.closest('.overlay')===el)return;
  if(el.tagName==='A'&&el.dataset.act==='opendoc')e.preventDefault();
  fn(el.dataset,el,e);
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&S.session){e.preventDefault();openCmd();return}
  if(e.key==='Escape'){closeLayer();$('#newpop')&&($('#newpop').hidden=true);return}
  if(e.key==='Enter'&&e.target.matches('.kcard,.note,.app')){e.target.click();return}
  const typing=e.target.closest('input,textarea,select,[contenteditable]');
  if(!typing&&S.session&&!$('#layer').innerHTML&&!e.metaKey&&!e.ctrlKey){const k=e.key.toLowerCase();const m={t:'task',p:'project',d:'doc',n:'note'}[k];if(m){e.preventDefault();NEW[m]({})}}
});
document.addEventListener('submit',e=>{
  const f=e.target;const kind=f.dataset.form;if(!kind)return;e.preventDefault();const o=Object.fromEntries(new FormData(f));
  if(kind==='aisend'){const q=(o.q||'').trim();if(!q)return;const prov=PROVIDERS.find(x=>x[0]===S.ai.provider);
    if(!S.ai.keys[S.ai.provider]){toast(`Conecte o ${prov[1]} na lista ao lado`);return}
    aiAsk(q);}
  if(kind==='addapp'){if(!o.n.trim()||!o.u.trim()){toast('Preencha nome e link');return}let u=o.u.trim();if(!/^https?:\/\//.test(u))u='https://'+u;S.apps.push({id:uid(),n:o.n.trim(),u,c:'#6C6C68',l:o.n.trim().slice(0,2),cat:'Meus apps',pin:true});toast('App adicionado e fixado no topo')}
  if(kind==='splink'){const m=(o.u||'').match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(playlist|album|track|episode|show)\/([A-Za-z0-9]+)/);if(!m){toast('Cole um link do Spotify, tipo open.spotify.com/playlist/...');return}S.sp={type:m[1],id:m[2]};save();render();toast('Spotify aberto');return}
  if(kind==='ytlink'){const m=(o.u||'').match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{6,})/);if(!m){toast('Cole um link do YouTube, tipo youtube.com/watch?v=...');return}S.yt={id:m[1],title:'Vídeo do YouTube',channel:'Link colado',dur:'·'};S.media={kind:'yt',playing:true,pip:false};save();render();toast('Vídeo aberto');return}
  if(kind==='slackmsg'){if(!o.t.trim())return;S.slack.channels.find(c=>c.id===f.dataset.ch).msgs.push({who:'Você',me:true,t:o.t.trim(),time:'agora'});save();render();if(f.dataset.panel||f.closest('#layer'))openApp(appByName('Slack').id);return}
  if(kind==='whatsmsg'){if(!o.t.trim())return;S.whats[+f.dataset.i].msgs.push({me:true,t:o.t.trim(),time:'agora'});save();render();openApp(appByName('WhatsApp').id);return}
  if(kind==='mailreply'){if(!o.t.trim())return;toast('Resposta enviada pelo Gmail');f.reset();return}
  if(kind==='figmacomment'){if(!o.t.trim())return;toast('Comentário deixado no Figma');f.reset();return}
  if(kind==='iaquick'){if(!o.q.trim())return;S.ai.role=o.role;aiAsk(o.q.trim());save();location.hash='assistentes';return}
  if(kind==='idea'){if(!o.t.trim())return;S.brain.ideias.unshift({id:uid(),t:o.t.trim(),b:o.b,tags:o.tags.split(',').map(x=>x.trim()).filter(Boolean),projectId:o.projectId||null,date:day(0)});toast('Ideia guardada')}
  if(kind==='brainlink'){if(!o.u.trim())return;let u=o.u.trim();if(!/^https?:/.test(u))u='https://'+u;const k=linkKind(u);S.brain.links.unshift({id:uid(),t:o.t.trim()||LINKK[k][2],u,k,projectId:o.projectId||null});toast(`Link do ${LINKK[k][2]} guardado`)}
  if(kind==='quicktask'){if(!o.title.trim())return;S.tasks.push({id:uid(),title:o.title.trim(),date:day(0),done:false,projectId:null});}
  if(kind==='addcheck'){if(!o.t.trim())return;project(f.dataset.id).checklist.push({id:uid(),t:o.t.trim(),done:false});save();render();openProject(f.dataset.id);setTimeout(()=>$('#layer [name=t]')?.focus(),20);return}
  if(kind==='quicknote'){if(!o.title.trim()&&!o.body.trim())return;const list=f.list.checked;S.notes.unshift({id:uid(),title:o.title.trim(),body:list?'':o.body,list:list?o.body.split('\n').filter(l=>l.trim()).map(t=>({t,done:false})):null,color:S.ui.noteColor,pinned:false,labels:o.labels?[o.labels.trim()]:[],created:day(0)});toast('Nota salva')}
  if(kind==='addref'){if(!o.title.trim()&&!pendingImg&&!o.url.trim()){toast('Dê um nome, cole um link ou envie uma imagem');return}
    const tags=o.tags.split(',').map(s=>s.trim()).filter(Boolean);
    S.refs.unshift(pendingImg?{id:uid(),kind:'image',title:o.title||'Imagem',src:pendingImg,url:o.url||'',tags}:{id:uid(),kind:'link',title:o.title||o.url,url:o.url,note:'',tags});pendingImg=null;toast('Referência salva')}
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pf){const p=project(t.dataset.id);const k=t.dataset.pf;p[k]=k==='value'?+t.value:k==='tags'?t.value.split(',').map(s=>s.trim()).filter(Boolean):t.value;save();render();openProject(p.id)}
  if(t.dataset.cf){const c=client(t.dataset.id);const k=t.dataset.cf;c[k]=k==='value'?+t.value:k==='phone'?t.value.replace(/\D/g,''):t.value;save();render();openClient(c.id)}
});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-scratch]')){S.ui.scratch=t.value;save()}if(t.dataset.pf==='title'){project(t.dataset.id).title=t.value;save()}if(t.dataset.cf==='company'){client(t.dataset.id).company=t.value;save()}});

/* Arrastar e soltar */
let drag=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-drag]');if(!c)return;drag={kind:c.dataset.drag,id:c.dataset.id};c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',c.dataset.id)}catch(_){}});
document.addEventListener('dragend',e=>{$$('.w.drop-at').forEach(x=>x.classList.remove('drop-at'));$$('.dragging').forEach(x=>x.classList.remove('dragging'));$$('.col.over').forEach(x=>x.classList.remove('over'));drag=null});
document.addEventListener('dragover',e=>{if(drag?.kind==='widget'){const w=e.target.closest?.('.w[data-w]');if(w&&w.dataset.w!==drag.id){e.preventDefault();$$('.w.drop-at').forEach(x=>x!==w&&x.classList.remove('drop-at'));w.classList.add('drop-at')}return}const col=e.target.closest?.('[data-drop]');if(col&&drag&&((drag.kind==='project'&&col.dataset.drop==='stage')||(drag.kind==='client'&&col.dataset.drop==='funil'))){e.preventDefault();$$('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')}});
document.addEventListener('drop',e=>{if(drag?.kind==='widget'){const w=e.target.closest?.('.w[data-w]');if(w){e.preventDefault();const L=S.ui.layout;const from=L.findIndex(x=>x.id===drag.id);const it=L.splice(from,1)[0];let to=L.findIndex(x=>x.id===w.dataset.w);const r=w.getBoundingClientRect();if(e.clientX>r.left+r.width/2)to++;L.splice(to,0,it);drag=null;save();render();const n=$(`.w[data-w="${it.id}"]`);n?.classList.add('landed')}return}const col=e.target.closest?.('[data-drop]');if(!col||!drag)return;e.preventDefault();
  if(drag.kind==='project'){const p=project(drag.id);if(p.stage!==col.dataset.v){p.stage=col.dataset.v;toast(`${p.title} foi para ${p.stage}`)}}
  else{const c=client(drag.id);if(c.funil!==col.dataset.v){c.funil=col.dataset.v;if(c.funil==='Proposta enviada'&&!c.followup)c.followup=day(3);toast(`${c.company} foi para ${c.funil}`)}}
  drag=null;save();render()});

render();
</script>
</body>
</html>
