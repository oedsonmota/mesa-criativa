<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>/* volta do login do Google: guarda o acesso e limpa o endereço antes de tudo */
(function(){var h=location.hash;if(h.indexOf('access_token=')<0&&h.indexOf('error=')<0)return;var p=new URLSearchParams(h.slice(1));
try{if(p.get('access_token')){sessionStorage.setItem('mesa-gtok',JSON.stringify({t:p.get('access_token'),exp:Date.now()+((+p.get('expires_in')||3600)-30)*1000}));sessionStorage.setItem('mesa-gnew','1')}else sessionStorage.setItem('mesa-gerr',p.get('error')||'erro')}catch(e){}
history.replaceState(null,'',location.pathname+location.search+'#'+(p.get('state')||'integracoes'))})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa Criativa</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231D1D1F'/%3E%3Cpath d='M15 46V18h7l10 15 10-15h7v28h-7V30l-10 14-10-14v16z' fill='%23FFFFFF'/%3E%3Ccircle cx='52' cy='47' r='4.5' fill='%23F43217'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<style>
:root{
  /* Layout: barra lateral fixa à esquerda + área de trabalho em cartões brancos sobre cinza claro, laranja só para destaque */
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --line:#E3E3E8;
  --accent:#F43217; --accent-ink:#FFFFFF; --accent-soft:#FFE7E2;
  --ok:#1D7F46; --ok-soft:#E1F2E7; --warn:#A86A0B; --warn-soft:#FBF0DB; --bad:#C2271B; --bad-soft:#FBE4E1;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.07);
  --n-branco:#FFFFFF; --n-amarelo:#FFF3C4; --n-verde:#DFF1E3; --n-azul:#DFEAF9; --n-rosa:#FADFE7; --n-laranja:#FFE3DC; --n-cinza:#ECECE8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F0F; --surface:#191918; --surface-2:#212120; --ink:#F1F1EE; --muted:#9C9C97; --line:#2C2C2A;
    --accent:#FF4A2E; --accent-soft:#3B1B15; --ok:#5CC98A; --ok-soft:#173022; --warn:#E3A945; --warn-soft:#33270F; --bad:#FF6B5E; --bad-soft:#3A1714;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --n-branco:#1E1E1D; --n-amarelo:#3A3215; --n-verde:#1B3324; --n-azul:#1A2A40; --n-rosa:#3A1C26; --n-laranja:#3F1E16; --n-cinza:#2A2A28;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --surface:#191918; --surface-2:#212120; --ink:#F1F1EE; --muted:#9C9C97; --line:#2C2C2A;
  --accent:#FF4A2E; --accent-soft:#3B1B15; --ok:#5CC98A; --ok-soft:#173022; --warn:#E3A945; --warn-soft:#33270F; --bad:#FF6B5E; --bad-soft:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --n-branco:#1E1E1D; --n-amarelo:#3A3215; --n-verde:#1B3324; --n-azul:#1A2A40; --n-rosa:#3A1C26; --n-laranja:#3F1E16; --n-cinza:#2A2A28;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.03em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* ---------- Auth ---------- */
#auth{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.auth-side{background:#0A0A0A;color:#F1F1EE;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.wordmark{font-weight:700;letter-spacing:-.04em;font-size:22px;text-transform:uppercase}
.wordmark b{color:var(--accent);font-weight:700}
.auth-side h1{font-size:clamp(34px,4.4vw,60px);line-height:1;font-weight:700;letter-spacing:-.045em;max-width:12ch}
.auth-side p{color:#A9A9A4;max-width:46ch;font-size:16px;margin:18px 0 0}
.replaces{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.replaces span{border:1px solid #2E2E2C;border-radius:999px;padding:6px 12px;font-size:13px;color:#8C8C87;text-decoration:line-through;text-decoration-color:var(--accent)}
.auth-feats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-top:1px solid #262624;padding-top:24px;font-size:13px;color:#A9A9A4}
.auth-feats strong{display:block;color:#F1F1EE;font-size:14px;margin-bottom:4px}
.auth-main{display:flex;align-items:center;padding:48px}
.auth-card{width:100%;max-width:400px}
.auth-card h2{font-size:28px;margin-bottom:6px}
.auth-card .sub{color:var(--muted);margin:0 0 24px}
.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--ink)}
textarea.input{resize:vertical;min-height:80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.block{width:100%}
.btn .g{width:16px;height:16px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:18px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.fine{font-size:12px;color:var(--muted);margin-top:18px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:-4px 0 10px}

/* ---------- App shell ---------- */
#app{height:100%;display:grid;grid-template-columns:248px 1fr}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:16px;overflow-y:auto}
.side .wordmark{padding:4px 8px 0;font-size:20px}
.searchbtn{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;color:var(--muted);text-align:left}
.searchbtn kbd{margin-left:auto;font:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--bg)}
.nav a .count{margin-left:auto;font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-weight:600}
.nav-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 10px;margin-top:6px}
.focus{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.focus-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted)}
.focus-time{font-size:26px;font-weight:700;letter-spacing:-.04em}
.focus.running{border-color:var(--accent)}
.focus.running .focus-time{color:var(--accent)}
.focus select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;width:100%}
.me{display:flex;align-items:center;gap:10px;padding:6px 4px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me>div:not(.avatar){min-width:0;flex:1}
.me strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proto-note{font-size:11px;color:var(--muted);padding:0 4px}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--bg)}
.top h1{font-size:22px;font-weight:700}
.top .sp{flex:1}
.menu-btn{display:none}
#view{flex:1;overflow:auto;padding:24px 28px 48px}
.newwrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:30;display:flex;flex-direction:column}
.pop button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px}
.pop button:hover{background:var(--surface-2)}
.pop button span{margin-left:auto;color:var(--muted);font-size:11px}

/* ---------- Building blocks ---------- */
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:15px;font-weight:700}
.card-h .sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 8px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.g{background:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-size:28px;font-weight:700;letter-spacing:-.04em;margin-top:6px}
.tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.tile.hl{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.hl .k,.tile.hl .d{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;font-weight:600;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar .sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--muted)}
.chip.on{border-color:var(--ink);color:var(--ink)}
.row{display:flex;align-items:center;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:12px;color:var(--muted)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.check:hover{border-color:var(--ink)}
.check.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.check svg{width:13px;height:13px;stroke-width:2.6}
.done .t{text-decoration:line-through;color:var(--muted)}
.stripe{width:3px;align-self:stretch;border-radius:3px;background:var(--line);flex:none}
.stripe.bad{background:var(--bad)}.stripe.warn{background:var(--warn)}.stripe.ok{background:var(--ok)}
.addline{display:flex;gap:8px;margin-top:12px}
.addline .input{padding:8px 12px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.gbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
.gmark{width:14px;height:14px;border-radius:4px;display:inline-grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}
.iconbtn{border:0;background:none;padding:6px;border-radius:8px;color:var(--muted);display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

/* Hoje */
.today-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.today-grid>div{display:flex;flex-direction:column;gap:16px;min-width:0}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.greet h2{font-size:30px;font-weight:700;letter-spacing:-.045em}
.greet p{margin:4px 0 0;color:var(--muted)}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0;padding-top:0}
.ev .h{width:52px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.ev .t{font-weight:600}
.mail{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mail:first-child{border-top:0;padding-top:0}
.mail .grow{flex:1;min-width:0}
.mail .snip{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.mini-notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini-notes .note{padding:12px;font-size:13px}

/* Kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px;transition:border-color .15s,background .15s}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 6px;font-weight:700;font-size:13px}
.col-h .n{color:var(--muted);font-weight:500}
.col-h .sum{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:grab;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s,border-color .15s}
.kcard:hover{border-color:color-mix(in srgb,var(--ink) 35%,var(--line));box-shadow:var(--shadow)}
.kcard.dragging{opacity:.4}
.kcard .t{font-weight:700;font-size:14px;letter-spacing:-.02em}
.kcard .c{font-size:12px;color:var(--muted);margin-top:-6px}
.kmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:4px}
.kfoot{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}
.kfoot span{display:inline-flex;align-items:center;gap:4px}
.kfoot svg.i{width:13px;height:13px}
.addcard{border:1px dashed var(--line);background:none;border-radius:10px;padding:8px;color:var(--muted);font-size:12px;font-weight:600}
.addcard:hover{border-color:var(--ink);color:var(--ink)}

table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tblwrap{overflow-x:auto;padding:4px 6px}

/* Gantt */
.gantt{position:relative}
.g-head,.g-row{display:grid;grid-template-columns:220px 1fr;align-items:center}
.g-head{border-bottom:1px solid var(--line);padding-bottom:8px;font-size:11px;color:var(--muted);font-weight:600}
.g-weeks{display:grid;grid-template-columns:repeat(6,1fr)}
.g-row{padding:10px 0;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-name{font-weight:600;font-size:13px;padding-right:12px;min-width:0}
.g-name span{display:block;font-size:12px;color:var(--muted);font-weight:400}
.g-track{position:relative;height:28px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/6 - 1px),var(--line) calc(100%/6 - 1px) calc(100%/6))}
.g-bar{position:absolute;top:4px;height:20px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden;cursor:pointer}
.g-bar.late{background:var(--bad);color:#fff}
.g-bar.done{background:var(--line);color:var(--muted)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:2}
.g-today:after{content:"hoje";position:absolute;top:-18px;left:-12px;font-size:10px;color:var(--accent);font-weight:700}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);font-size:11px;font-weight:600;color:var(--muted);padding:8px 10px;text-transform:uppercase;letter-spacing:.04em}
.cal .cell{background:var(--surface);min-height:112px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal .cell:hover{background:var(--surface-2)}
.cal .cell.out{background:var(--surface-2)}
.cal .cell.out .dn{color:var(--muted);opacity:.6}
.cal .dn{font-size:12px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .cell.today .dn{background:var(--accent);color:#fff}
.cal .it{font-size:11px;border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.it.ev{background:var(--n-azul)}
.it.tk{background:var(--surface-2);border:1px solid var(--line)}
.it.tk.dn2{text-decoration:line-through;color:var(--muted)}
.it.dl{background:var(--accent-soft);color:var(--accent);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Docs */
.docs{display:grid;grid-template-columns:260px 1fr;gap:16px;height:100%;min-height:560px}
.doclist{display:flex;flex-direction:column;gap:12px;overflow:auto}
.folder h4{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 4px 8px;font-weight:600}
.docitem{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:8px;color:var(--ink)}
.docitem:hover{background:var(--surface-2)}
.docitem.on{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.docitem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docpane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.docbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fmt{display:flex;gap:2px;flex-wrap:wrap}
.fmt button{border:0;background:none;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:600;color:var(--muted)}
.fmt button:hover{background:var(--surface-2);color:var(--ink)}
.docbody{flex:1;overflow:auto;padding:36px 48px 60px}
.doctitle{border:0;outline:none;background:none;font-size:34px;font-weight:700;letter-spacing:-.045em;width:100%;padding:0;margin-bottom:6px}
.docmeta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:26px;flex-wrap:wrap}
.docmeta select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:12px}
.editor{outline:none;max-width:72ch;font-size:15px;line-height:1.65}
.editor h2{font-size:22px;margin:26px 0 8px}
.editor h3{font-size:17px;margin:20px 0 6px}
.editor p{margin:0 0 10px}
.editor ul,.editor ol{padding-left:22px;margin:0 0 12px}
.editor blockquote{margin:12px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0}
.editor hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.editor .todo{list-style:none;padding-left:0}
.editor .todo li{display:flex;gap:8px;align-items:flex-start}
.editor .todo li:before{content:"";width:14px;height:14px;border:1.5px solid var(--muted);border-radius:4px;margin-top:5px;flex:none}
.editor .todo li.ok:before{background:var(--ink);border-color:var(--ink)}
.editor .todo li.ok{color:var(--muted);text-decoration:line-through}
.editor table{border-collapse:collapse;margin:8px 0 14px;width:100%}
.editor td,.editor th{border:1px solid var(--line);padding:6px 10px;text-align:left}

/* Notes */
.quick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-width:620px;margin-bottom:22px;box-shadow:var(--shadow)}
.quick input,.quick textarea{border:0;outline:none;background:none;width:100%;padding:4px 2px;resize:none}
.quick input{font-weight:700;font-size:15px}
.quick-f{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.swatches{display:flex;gap:5px}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:1px}
.masonry{columns:4 250px;column-gap:14px}
.note{break-inside:avoid;margin-bottom:14px;border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--n-branco);position:relative;cursor:pointer}
.note h4{margin:0 0 6px;font-size:14px;letter-spacing:-.02em}
.note p{margin:0;white-space:pre-wrap;font-size:13px}
.note ul{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.note ul li{display:flex;gap:8px;align-items:flex-start}
.note ul li.ok{text-decoration:line-through;color:var(--muted)}
.note .nb{display:flex;gap:2px;margin-top:10px;opacity:0;transition:opacity .15s}
.note:hover .nb,.note:focus-within .nb{opacity:1}
.note .pinned{position:absolute;top:10px;right:10px;color:var(--accent)}
.note .labels{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin:4px 0 10px}

/* Refs */
.refs{columns:4 240px;column-gap:14px}
.ref{break-inside:avoid;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ref .body{padding:12px 14px}
.ref .body strong{display:block;font-size:13px}
.ref .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.palette{display:flex;height:150px}
.palette div{flex:1;display:flex;align-items:flex-end;padding:8px 6px;font-size:10px;font-weight:600}
.specimen{padding:22px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.specimen .big{font-size:56px;line-height:1;letter-spacing:-.03em}
.specimen .abc{font-size:13px;color:var(--muted);margin-top:10px;word-break:break-all}
.ref img{display:block;width:100%}
.linkprev{padding:18px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.linkprev .dom{font-size:11px;color:var(--muted);font-weight:600}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;background:var(--surface);margin-bottom:20px;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .input{flex:1;min-width:160px}

/* Integrations */
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:28px}
.intc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.intc.on{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.int-top{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.intc h4{margin:0;font-size:14px}
.intc p{margin:0;font-size:13px;color:var(--muted);flex:1}
.int-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.banner{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:20px 22px;display:flex;gap:18px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
.banner h3{font-size:18px}
.banner p{margin:4px 0 0;color:color-mix(in srgb,var(--bg) 70%,transparent);max-width:70ch;font-size:13px}
.banner .sp{flex:1}

/* Finance chart */
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .gl{stroke:var(--line)}
.fin-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}

/* Modal / drawer / palette */
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.42);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;z-index:50;animation:fade .15s}
.overlay.right{justify-content:flex-end;padding:0;align-items:stretch}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:520px;box-shadow:var(--shadow);max-height:84vh;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.modal-h h3{font-size:18px;flex:1}
.modal-b{padding:12px 20px 4px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cbx{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}
.cbx input{accent-color:var(--accent);width:16px;height:16px}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;border-left:1px solid var(--line);box-shadow:var(--shadow);animation:slide .2s ease-out;display:flex;flex-direction:column}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.drawer-h{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.drawer-b{padding:20px;display:flex;flex-direction:column;gap:22px}
.dtitle{border:0;outline:none;background:none;font-size:26px;font-weight:700;letter-spacing:-.04em;width:100%;padding:0}
.props{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:center;font-size:13px}
.props label{color:var(--muted);font-weight:500}
.props .input{padding:7px 10px}
.stagebar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.stagebar button{border:0;height:30px;border-radius:7px;background:var(--surface-2);font-size:11px;font-weight:600;color:var(--muted);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagebar button.past{background:color-mix(in srgb,var(--ink) 14%,var(--surface));color:var(--ink)}
.stagebar button.cur{background:var(--accent);color:#fff}
.sub-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sub-h .sp{flex:1}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13px}
.ftype{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none;text-transform:uppercase}
.palette-m{max-width:600px}
.cmdin{border:0;outline:none;background:none;font-size:17px;width:100%;padding:16px 20px;border-bottom:1px solid var(--line)}
.cmdlist{overflow:auto;padding:8px;max-height:52vh}
.cmd{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px}
.cmd.on,.cmd:hover{background:var(--surface-2)}
.cmd .k{margin-left:auto;font-size:11px;color:var(--muted)}
.cmdgroup{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px 12px 4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:var(--shadow);z-index:80;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}

/* Dock, wallpaper, IA, apps, personalizar */
.dock{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.dock a,.dock button{cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;text-decoration:none;border:0;transition:transform .12s}
.dock a:hover{transform:translateY(-2px)}
.dock button[data-act=goapps]{background:none;color:var(--muted)}
.main{background:var(--wall,none) center/cover no-repeat,var(--bg)}
.has-wall .top{background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.has-wall .card,.has-wall .tile,.has-wall .col,.has-wall .docpane,.has-wall .intc,.has-wall .ref,.has-wall .kcard{backdrop-filter:blur(10px)}
.has-wall .greet>div:first-child,.has-wall .sec-t,.has-wall .set-sec>h3,.has-wall .set-sec>p{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--r);padding:14px 18px;width:fit-content;max-width:100%}
.has-wall .sec-t,.has-wall .set-sec>h3,.has-wall .set-sec>p{padding:4px 10px;border-radius:8px}
.ai{display:grid;grid-template-columns:280px 1fr;gap:16px;min-height:560px}
.ai-side{display:flex;flex-direction:column;gap:12px}
.prov{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;text-align:left}
.prov.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.prov .logo{width:30px;height:30px;font-size:12px;border-radius:8px}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-h select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:12px}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:320px}
.msg{max-width:78%;padding:12px 14px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .who{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;white-space:normal}
.msg-actions{display:flex;gap:6px;margin-top:8px;white-space:normal}
.prompts{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.chat-in{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.chat-in textarea{flex:1;resize:none;min-height:44px;max-height:140px}
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.app{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-decoration:none;position:relative;transition:transform .12s,border-color .12s}
.app:hover{transform:translateY(-2px);border-color:var(--ink)}
.app .logo{width:42px;height:42px;border-radius:12px;font-size:15px}
.app strong{font-size:14px}
.app span{font-size:12px;color:var(--muted)}
.app .pinb{position:absolute;top:8px;right:8px}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.look{display:flex;flex-direction:column;justify-content:flex-start;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);text-align:left;padding:0}
.look.on{outline:2px solid var(--accent);outline-offset:2px}
.look .pv{height:92px;display:grid;grid-template-columns:28% 1fr;gap:6px;padding:8px}
.look .pv i{border-radius:6px;display:block}
.look .pv div{display:flex;flex-direction:column;gap:6px}
.look .lb{flex:1;padding:10px 12px;border-top:1px solid var(--line)}
.look .lb strong{display:block;font-size:13px}
.look .lb span{font-size:12px;color:var(--muted)}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mood{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px}
.mood.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.wall{height:70px;border-radius:12px;border:1px solid var(--line);background-size:cover;background-position:center;padding:0;position:relative}
.wall.on{outline:2px solid var(--accent);outline-offset:2px}
.wall span{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:600;color:var(--ink);background:var(--surface);padding:1px 6px;border-radius:6px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.mod{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mod input{accent-color:var(--accent);width:16px;height:16px}
.set-sec{margin-bottom:28px}
.set-sec h3{font-size:16px;margin-bottom:4px}
.set-sec>p{margin:0 0 14px;color:var(--muted);font-size:13px}
@media (max-width:860px){.ai{grid-template-columns:1fr}.msg{max-width:92%}}

@media (max-width:1100px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .today-grid,.fin-grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .menu-btn{display:inline-grid}
  .top{padding:12px 16px}
  #view{padding:16px 16px 40px}
  .docs{grid-template-columns:1fr}
  .doclist{max-height:220px}
  .docbody{padding:24px 18px 40px}
  #auth{grid-template-columns:1fr}
  .auth-side{padding:28px 20px}
  .auth-feats{grid-template-columns:1fr}
  .auth-main{padding:28px 20px}
  .g-head,.g-row{grid-template-columns:130px 1fr}
  .cal .cell{min-height:76px}
  .cal .it{font-size:10px}
}
@media (max-width:480px){
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile .v{font-size:22px}
  .two{grid-template-columns:1fr}
  .top h1{font-size:18px}
  .top .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v2: widgets, janelas, cérebro, conectores ===== */
.wgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-flow:row dense;gap:18px;align-items:start}
.w{grid-column:span var(--span);min-width:0;position:relative}
.w.bare{padding:0}
.w-h{min-height:28px}
.pinmark{color:var(--accent);display:inline-grid}
.pinmark svg{width:14px;height:14px}
.w-tools{display:flex;gap:4px;align-items:center}
.w-tools .iconbtn.on{color:var(--accent)}
.handle{color:var(--muted);cursor:grab;display:inline-grid}
.w.editing{cursor:grab;outline:1.5px dashed color-mix(in srgb,var(--ink) 22%,transparent);outline-offset:4px}
.w.editing .w-b{pointer-events:none;user-select:none}
.w.bare.editing{padding:14px;border-radius:var(--r);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.w.drop-at{outline:2px solid var(--accent)!important;outline-offset:4px}
.w.dragging{opacity:.35}
.edit-tip{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:-6px 0 16px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(20px);width:fit-content}
.mini-thread{display:flex;flex-direction:column;gap:10px}
.sm-msg{display:flex;gap:10px;font-size:13px}
.sm-msg strong{font-size:13px}
.docitem .count-dot{flex:none;margin:0}
.count-dot{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:#1FA855;color:#fff;font-size:10px;font-weight:700;padding:0 5px;margin-top:4px}
.player-mini{display:flex;gap:14px;align-items:center}
.cover{width:84px;height:84px;border-radius:14px;flex:none;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.prog i.playing{animation:play 6s linear infinite}
@keyframes play{from{width:10%}to{width:96%}}
.thumb{width:64px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff}
.thumb svg{width:16px;height:16px;fill:#fff;stroke:none}
.minibars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:140px}
.minibars div{display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.minibars i{display:block;width:100%;max-width:34px;border-radius:8px 8px 4px 4px}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.shortcuts button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:6px;border-radius:12px}
.shortcuts button:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.shortcuts .logo{width:44px;height:44px;border-radius:12px;font-size:14px}
.wcat{display:flex;flex-direction:column;gap:6px}
.wopt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left}
.wopt>div{flex:1}
.wopt:hover{border-color:var(--ink)}
.appwin{width:min(880px,100%);overflow:hidden}
.appbody{flex:1;min-height:0;display:flex;flex-direction:column}
.appcols{display:grid;grid-template-columns:230px 1fr;flex:1;min-height:0}
.appcols .left{border-right:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:2px}
.appcols .right{display:flex;flex-direction:column;min-height:0;min-width:0}
.thread{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.appscroll{overflow:auto;padding:20px;flex:1}
.appswitch{display:flex;gap:4px}
.appswitch button{width:26px;height:26px;border-radius:7px;border:0;color:#fff;font-size:9px;font-weight:700}
.player-big{aspect-ratio:16/9;border-radius:18px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.player-big span{position:absolute;inset:0;display:grid;place-items:center}
.player-big span svg{width:64px;height:64px;fill:rgba(255,255,255,.92);stroke:none;filter:drop-shadow(0 6px 20px rgba(0,0,0,.4))}
.player-big strong{position:relative;font-size:18px}
.figma-canvas{background:#E5E5E5;border-radius:16px;padding:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:12px}
.artboard{display:flex;flex-direction:column;gap:6px;font-size:11px;color:#555}
.artboard div{aspect-ratio:1;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.fakebrowser{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.fb-bar{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.fb-bar i{width:11px;height:11px;border-radius:50%;background:#FF5F57}
.fb-bar i:nth-child(2){background:#FEBC2E}.fb-bar i:nth-child(3){background:#28C840}
.fb-bar span{margin-left:10px;font-size:12px;color:var(--muted);background:var(--surface);border-radius:8px;padding:3px 10px;flex:1}
.fb-body{padding:48px 32px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:520px}
.fb-body h3{font-size:20px}
.fb-body p{margin:0}
.toolcard{margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;white-space:normal}
.toolcard.pending{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.toolcard.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.tool-detail{font-size:13px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.prompt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:22px}
.prompt{display:flex;flex-direction:column;gap:10px}
.pbody{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.pbody mark{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px;font-weight:600}
.idea{cursor:default}
.idea .pill{cursor:pointer}
.idea-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:0;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600}
.idea-link svg{width:13px;height:13px}
@media (max-width:1100px){.w{grid-column:span 6}.w.big,.w[style*="--span:12"]{grid-column:span 12}}
@media (max-width:760px){.w{grid-column:span 12!important}.appcols{grid-template-columns:1fr}.appcols .left{max-height:150px;border-right:0;border-bottom:1px solid var(--line)}.appswitch{display:none}}

/* ===== Acabamento estilo Apple ===== */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:20px;--r-sm:12px;
  --spring:cubic-bezier(.34,1.4,.64,1);--ease:cubic-bezier(.22,1,.36,1);
  --glass:color-mix(in srgb,var(--surface) 72%,transparent);
  --glass-strong:color-mix(in srgb,var(--surface) 86%,transparent);--hl:color-mix(in srgb,#fff 55%,transparent);
  --hair:color-mix(in srgb,var(--ink) 8%,transparent);
  --lift:0 1px 1px rgba(0,0,0,.03),0 4px 10px rgba(0,0,0,.04),0 16px 40px rgba(0,0,0,.07);
  --wall-auto:radial-gradient(1100px 760px at 6% -6%,#FFD7C6 0%,transparent 62%),radial-gradient(900px 700px at 102% 10%,#D6E0FF 0%,transparent 58%),radial-gradient(1000px 800px at 60% 110%,#EFE3FF 0%,transparent 62%),radial-gradient(700px 500px at 35% 55%,#FFF4E6 0%,transparent 70%),linear-gradient(#F3F2F0,#F3F2F0);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall-auto:radial-gradient(1100px 760px at 6% -6%,#4A1F14 0%,transparent 60%),radial-gradient(900px 700px at 102% 10%,#16244A 0%,transparent 58%),radial-gradient(1000px 800px at 60% 110%,#2A1A44 0%,transparent 62%),linear-gradient(#0C0C0E,#0C0C0E);--lift:0 1px 1px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45);--hl:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--wall-auto:radial-gradient(1100px 760px at 6% -6%,#4A1F14 0%,transparent 60%),radial-gradient(900px 700px at 102% 10%,#16244A 0%,transparent 58%),radial-gradient(1000px 800px at 60% 110%,#2A1A44 0%,transparent 62%),linear-gradient(#0C0C0E,#0C0C0E);--lift:0 1px 1px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45);--hl:rgba(255,255,255,.06)}
body{background-color:var(--bg);background-image:var(--wall,none);background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;letter-spacing:-.011em}
.main{background:none!important}
#app{background:none}
.side{background:var(--glass);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-right:1px solid var(--hair)}
.top{background:color-mix(in srgb,var(--bg) 40%,transparent)!important;backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--hair);position:relative;z-index:5}
.card,.tile,.col,.docpane,.intc,.ref,.chat,.quick,.drop,.look,.mod,.prov,.app,.kcard,.note,.focus,.searchbtn,.dock,.banner,.wopt{border-color:var(--hair)!important}
.card,.tile,.col,.docpane,.intc,.ref,.chat,.drop,.look,.mod,.prov,.app,.focus,.dock{background:var(--glass);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);box-shadow:inset 0 1px 0 var(--hl),var(--lift)}
.kcard{background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--hl),0 1px 2px rgba(0,0,0,.05)}
.col{background:color-mix(in srgb,var(--surface) 45%,transparent)}
.tile.hl{background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 88%,#fff) 0%,var(--accent) 45%,color-mix(in srgb,var(--accent) 72%,#000) 100%);color:#fff;border-color:transparent!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 30px color-mix(in srgb,var(--accent) 35%,transparent)}
.tile.hl .k,.tile.hl .d{color:rgba(255,255,255,.78)}
.banner{background:linear-gradient(135deg,#1C1C1E 0%,#2C2C2E 60%,color-mix(in srgb,var(--accent) 40%,#2C2C2E) 130%);color:#F5F5F7;box-shadow:var(--lift)}
.banner p{color:rgba(245,245,247,.72)}
.greet h2{font-size:34px;letter-spacing:-.035em;font-weight:700}
.top h1{letter-spacing:-.025em}
.wordmark{letter-spacing:-.03em;font-size:17px!important}
.nav a{border-radius:10px;transition:background .2s var(--ease),color .2s}
.nav a.on{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.nav a.on svg{color:var(--accent)}
.seg{background:color-mix(in srgb,var(--ink) 6%,transparent);border:0;padding:3px}
.seg button{transition:background .25s var(--ease),color .2s,box-shadow .25s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 3px 10px rgba(0,0,0,.06)}
.btn{transition:transform .35s var(--spring),background .2s,border-color .2s,box-shadow .2s;border-color:var(--hair)}
.btn:active,.iconbtn:active,.check:active,.chip:active,.mood:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,#fff) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.15)}
.btn.accent{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff) 0%,var(--accent) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.chip,.mood{transition:transform .35s var(--spring),border-color .2s,background .2s}
.check{transition:transform .35s var(--spring),background .2s,border-color .2s;border-radius:50%}
.check.on{animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.kcard,.app,.tile,.look,.wall,.ref,.intc,.note{transition:transform .45s var(--spring),box-shadow .3s var(--ease),border-color .2s}
.kcard:hover,.app:hover,.look:hover,.ref:hover,.intc:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 var(--hl),0 18px 44px rgba(0,0,0,.12)}
.note:hover{transform:translateY(-2px) rotate(-.3deg)}
.input{transition:border-color .2s,box-shadow .2s;border-color:var(--hair)}
.input:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.overlay{background:rgba(0,0,0,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .3s var(--ease)}
.modal{background:var(--glass-strong);backdrop-filter:saturate(180%) blur(40px);-webkit-backdrop-filter:saturate(180%) blur(40px);border-radius:24px;border:1px solid var(--hair);box-shadow:0 30px 80px rgba(0,0,0,.25);animation:zoom .45s var(--spring)}
@keyframes zoom{from{opacity:0;transform:scale(.94) translateY(8px)}}
.drawer{background:var(--glass-strong);backdrop-filter:saturate(180%) blur(40px);-webkit-backdrop-filter:saturate(180%) blur(40px);border-left:1px solid var(--hair);animation:slide .5s var(--ease);box-shadow:-30px 0 80px rgba(0,0,0,.18)}
.drawer-h{background:transparent;backdrop-filter:blur(20px)}
@keyframes slide{from{transform:translateX(60px);opacity:0}}
#toast{background:color-mix(in srgb,#1C1C1E 88%,transparent);color:#F5F5F7;backdrop-filter:blur(20px);animation:toast .5s var(--spring)}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}
#view.enter>*{animation:rise .6s var(--ease) both}
#view.enter>*:nth-child(2){animation-delay:.04s}#view.enter>*:nth-child(3){animation-delay:.08s}#view.enter>*:nth-child(4){animation-delay:.12s}
#view.enter .wgrid>.w{animation:rise .65s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
.w.landed{animation:landed .6s var(--spring)}
@keyframes landed{from{transform:scale(.96)}}
.w.editing{animation:wiggle .28s ease-in-out infinite alternate;animation-delay:calc(var(--i,0)*-70ms)}
@keyframes wiggle{from{transform:rotate(-.25deg)}to{transform:rotate(.25deg)}}
.dock{border-radius:14px;padding:4px}
.dock button{transition:transform .35s var(--spring)}
.dock button:hover{transform:translateY(-3px) scale(1.12)}
.logo,.gmark,.dock button,.appswitch button{background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.msg.me{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:#fff}
.msg.bot{background:var(--glass-strong);border-color:var(--hair)}
.cal{background:var(--hair);border-color:var(--hair)}
.cal .cell,.cal .dow{background:var(--glass-strong)}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.avatar{background-image:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0))}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 18%,transparent);border-radius:10px;border:3px solid transparent;background-clip:content-box}
#auth{background:var(--wall-auto)}
.auth-side{background:radial-gradient(900px 600px at 0% 0%,color-mix(in srgb,var(--accent) 45%,transparent),transparent 60%),radial-gradient(700px 600px at 100% 100%,#1F2B5E,transparent 60%),#0A0A0C}
.auth-card{background:var(--glass);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border:1px solid var(--hair);border-radius:28px;padding:32px;box-shadow:var(--lift);animation:zoom .6s var(--spring)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v3: cara de apple.com ===== */
:root{
  --wall-dots:radial-gradient(circle at 1.5px 1.5px,rgba(29,29,31,.16) 1px,transparent 1.4px);
  --glass:color-mix(in srgb,var(--surface) 94%,transparent);
  --glass-strong:color-mix(in srgb,var(--surface) 96%,transparent);
  --hair:color-mix(in srgb,var(--ink) 6%,transparent);
  --lift:0 1px 2px rgba(0,0,0,.03),0 6px 24px rgba(0,0,0,.05);
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall-dots:radial-gradient(circle at 1px 1px,rgba(255,255,255,.10) 1px,transparent 1.4px)}}
:root[data-theme="dark"]{--wall-dots:radial-gradient(circle at 1px 1px,rgba(255,255,255,.10) 1px,transparent 1.4px)}
body{background-size:var(--wall-size,cover);background-repeat:var(--wall-repeat,no-repeat)}
.side{background:color-mix(in srgb,var(--surface-2) 78%,transparent)}
.top{background:color-mix(in srgb,var(--surface) 72%,transparent)!important;padding:12px 28px}
.top h1{font-size:19px;font-weight:600}
.card,.tile,.docpane,.intc,.ref,.chat,.look,.mod,.prov,.app,.focus{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface);box-shadow:var(--lift)}
.card:hover{box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 34px rgba(0,0,0,.07)}
.greet{margin:8px 0 28px}
.greet h2{font-size:clamp(34px,4.2vw,52px);font-weight:700;letter-spacing:-.045em;line-height:1.02}
.greet p{font-size:17px;color:var(--muted);margin-top:8px;letter-spacing:-.015em}
.card-h h3,.w-h h3{font-size:17px;font-weight:600;letter-spacing:-.02em}
.nav a{padding:6px 10px;gap:10px;font-weight:500;color:var(--ink)}
.nav a.on{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.nav a.on svg{color:#fff}
.nav-label{color:var(--muted);text-transform:none;letter-spacing:-.01em;font-size:12px;margin-top:12px}
.ti{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;flex:none;color:#fff;background:linear-gradient(180deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(0,0,0,.15)}
.ti svg.i{width:15px;height:15px;stroke:#fff;stroke-width:2}
.ti b{font-size:10px;font-weight:700}
.ti.lg{width:44px;height:44px;border-radius:11px}
.ti.lg svg.i{width:24px;height:24px}
.w-h{gap:10px}
.searchbtn{background:color-mix(in srgb,var(--ink) 5%,transparent);border:0!important}
.tile .v{font-size:32px;letter-spacing:-.04em}
/* YouTube */
.ytplayer{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;cursor:pointer;background:#000}
.ytbg{position:absolute;inset:0;background:radial-gradient(600px 300px at 20% 30%,#3a3a3c,transparent 60%),radial-gradient(500px 300px at 80% 80%,#F43217,transparent 55%),linear-gradient(135deg,#0A0A0A,#2C2C2E);transition:transform 6s ease}
.ytplayer:hover .ytbg{transform:scale(1.04)}
.ytplayer.on .ytbg{animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12) translate(-2%,1%)}}
.ytmeta{position:absolute;left:20px;bottom:18px;color:#fff;display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.ytmeta strong{font-size:20px;letter-spacing:-.02em}
.ytmeta span{font-size:13px;opacity:.8}
.ytbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;border:0;background:rgba(255,255,255,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;place-items:center;transition:transform .4s var(--spring),background .2s;pointer-events:none}
.ytplayer:hover .ytbtn{transform:translate(-50%,-50%) scale(1.08);background:rgba(255,255,255,.32)}
.ytplayer.on .ytbtn{opacity:0;transition:opacity .3s}
.ytplayer.on:hover .ytbtn{opacity:1}
.ytbtn svg{width:28px;height:28px;fill:#fff;stroke:none}
.ytprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)}
.ytprog i{display:block;height:100%;background:#E62117;animation:play 40s linear infinite}
/* Cinema */
.cinema{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.poster{position:relative;aspect-ratio:16/10;border-radius:16px;border:0;overflow:hidden;color:#fff;text-align:left;padding:0;cursor:pointer;transition:transform .5s var(--spring),box-shadow .3s}
.poster:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 20px 40px rgba(0,0,0,.25)}
.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.7))}
.pbadge{position:absolute;top:10px;left:12px;font-size:11px;font-weight:700;letter-spacing:.02em;z-index:1;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);padding:3px 8px;border-radius:999px}
.pinfo{position:absolute;left:12px;right:12px;bottom:10px;z-index:1;display:flex;flex-direction:column}
.pinfo strong{font-size:14px;letter-spacing:-.01em}
.pinfo span{font-size:11px;opacity:.8}
.pplay{position:absolute;right:10px;top:10px;z-index:1;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.poster:hover .pplay{opacity:1}
.pplay svg{width:14px;height:14px;fill:#fff;stroke:none}
@media (max-width:900px){.cinema{grid-template-columns:repeat(2,1fr)}}
/* Mini player */
#pip{position:fixed;right:20px;bottom:20px;z-index:70;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 8px;width:330px;border-radius:18px;background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border:1px solid var(--hair);box-shadow:0 20px 50px rgba(0,0,0,.18);animation:zoom .5s var(--spring)}
.pip-art{width:64px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center}
.pip-art svg{width:16px;height:16px;fill:#fff;stroke:none}
.pip-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.pip-txt strong{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pip-txt span{font-size:11px;color:var(--muted)}
#toast{bottom:84px}
/* Conexão estilo login */
.oauth{max-width:440px}
.oauth-h{display:flex;align-items:center;gap:12px;padding:20px 20px 4px}
.oauth-h .logo{width:36px;height:36px;border-radius:10px;font-size:15px}
.perms{display:flex;flex-direction:column;gap:8px}
.perm{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.perm input{accent-color:var(--accent);width:16px;height:16px;margin-top:2px}
.steps{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.howto div{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--lift)}
.howto b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;margin-bottom:8px}
.howto strong{display:block;font-size:15px;margin-bottom:2px}
.howto span{font-size:13px;color:var(--muted)}
@media (max-width:760px){.howto{grid-template-columns:1fr}}
/* Kits de marca */
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.kit{display:flex;flex-direction:column;gap:14px}
.kit-top{display:flex;align-items:center;gap:12px}
.kit-logo{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:16px;overflow:hidden;flex:none}
.kit-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.kit-sw{display:flex;height:64px;border-radius:12px;overflow:hidden}
.kit-sw button{flex:1;border:0;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-weight:600;cursor:copy;transition:flex .4s var(--spring)}
.kit-sw button:hover{flex:1.6}
.kit-fonts{display:flex;flex-direction:column;gap:6px}
.kit-fonts div{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.kf{font-size:17px;font-weight:600;letter-spacing:-.02em}
.kit>.btn{align-self:flex-start}
.kit-voz{margin:0;font-size:13px;color:var(--muted)}

/* ===== v4: branco de verdade, sem degradê, blocos que se arrastam ===== */
:root{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F5F5F7;--tile:#F5F5F7;--line:#E5E5EA;--hair:rgba(0,0,0,.07);--lift:none;--hl:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--surface:#1C1C1E;--surface-2:#1C1C1E;--tile:#1C1C1E;--line:#2C2C2E;--hair:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg:#000000;--surface:#1C1C1E;--surface-2:#1C1C1E;--tile:#1C1C1E;--line:#2C2C2E;--hair:rgba(255,255,255,.08)}
.side{background:var(--bg);border-right:1px solid var(--hair)}
.top{background:color-mix(in srgb,var(--bg) 80%,transparent)!important}
.card,.tile,.docpane,.intc,.ref,.chat,.look,.mod,.prov,.app,.focus,.col,.howto div{background:var(--tile);box-shadow:none!important;border:0!important}
.card:hover{box-shadow:none}
.kcard,.note{box-shadow:none}
.card .input,.tile .input,.chat .input,.card .addline .input{background:var(--bg)}
.searchbtn{background:var(--tile)}
/* ícones chapados, sem degradê */
.ti{background:var(--b);box-shadow:none;border-radius:8px}
.logo,.gmark,.dock button,.appswitch button,.avatar{background-image:none!important;box-shadow:none!important}
.tile.hl{background:var(--ink);color:var(--bg);box-shadow:none}
.tile.hl .k,.tile.hl .d{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.btn.primary,.btn.accent{background-image:none;box-shadow:none}
.btn.primary{background:var(--ink)}
.btn.accent{background:var(--accent)}
.msg.me{background:var(--accent)}
.banner{background:var(--ink);color:var(--bg)}
.banner p{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.dock{background:var(--tile);border:0!important;box-shadow:none}
.ytbg{background:#1D1D1F}
.ytplayer.on .ytbg{animation:none}
.nav a.on{background:var(--tile)}
.nav a.on svg{color:#fff}
/* arrastar e redimensionar */
.w{position:relative}
.w-grip{display:inline-grid;place-items:center;width:18px;margin-left:-6px;color:var(--muted);opacity:0;transition:opacity .2s;cursor:grab}
.w:hover .w-grip,.w.editing .w-grip{opacity:1}
.w-h{cursor:grab}
.w.bare{cursor:grab}
.w-resize{position:absolute;right:6px;bottom:6px;width:18px;height:18px;cursor:nwse-resize;opacity:0;transition:opacity .2s;z-index:3;border-radius:5px}
.w-resize:before{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);border-bottom-right-radius:3px}
.w:hover .w-resize,.w.resizing .w-resize{opacity:1}
body.wbusy{user-select:none;-webkit-user-select:none}
body.wgrabbing,body.wgrabbing *{cursor:grabbing!important}
.w-placeholder{outline:2px dashed color-mix(in srgb,var(--accent) 55%,transparent)!important;outline-offset:-2px;background:color-mix(in srgb,var(--accent) 6%,var(--bg))!important}
.w-placeholder>*{opacity:0}
.wghost{position:fixed!important;z-index:90;pointer-events:none;margin:0;transform:scale(1.03) rotate(-.6deg);box-shadow:0 30px 70px rgba(0,0,0,.22)!important;border-radius:var(--r);background:var(--tile);opacity:.96;transition:transform .2s}
.w.resizing{outline:2px solid var(--accent);outline-offset:3px;z-index:4;transition:none}
.wsize-badge{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;z-index:5;pointer-events:none}
.wgrid{position:relative}
.wguides{position:absolute;inset:-6px 0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:inherit;column-gap:18px;pointer-events:none;z-index:0}
.wguides i{background:color-mix(in srgb,var(--accent) 3%,transparent);border-radius:8px;border:1px dashed color-mix(in srgb,var(--accent) 22%,transparent)}
.cover{box-shadow:none}
#auth{background:var(--bg)}
.auth-side{background:#000}
.auth-card{background:var(--tile);box-shadow:none;border:0}
.w.editing{animation:none}

/* ===== v5: degradê refinado, pontilhado no branco, animações Apple ===== */
:root{--wall-dots:radial-gradient(circle at 1.5px 1.5px,rgba(29,29,31,.14) 1px,transparent 1.4px);--apple:cubic-bezier(.32,.72,0,1)}
/* ícones: degradê na mesma cor, de cima mais claro para baixo, brilho fino */
.ti{background:linear-gradient(180deg,color-mix(in srgb,var(--b) 70%,#fff) 0%,var(--b) 55%,color-mix(in srgb,var(--b) 88%,#000) 100%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.45),inset 0 -.5px 0 rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.14);border-radius:8px}
.logo,.gmark,.dock button,.appswitch button{background-image:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 55%,rgba(0,0,0,.08) 100%)!important;box-shadow:inset 0 .5px 0 rgba(255,255,255,.35)!important}
.tile.hl{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 72%,#fff) 0%,var(--accent) 48%,color-mix(in srgb,var(--accent) 80%,#000) 100%);color:#fff}
.tile.hl .k,.tile.hl .d{color:rgba(255,255,255,.8)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 80%,#fff) 0%,var(--ink) 100%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.2)}
.btn.accent{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 78%,#fff) 0%,var(--accent) 100%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.3)}
.msg.me{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent))}
.banner{background:linear-gradient(140deg,#1D1D1F 0%,#2C2C2E 70%,color-mix(in srgb,var(--accent) 35%,#2C2C2E) 120%);color:#F5F5F7}
.banner p{color:rgba(245,245,247,.72)}
.ytbg{background:radial-gradient(70% 90% at 80% 85%,color-mix(in srgb,var(--accent) 70%,transparent),transparent 60%),linear-gradient(160deg,#3A3A3C,#121214)}
.cover{box-shadow:0 6px 16px rgba(0,0,0,.14)}
.avatar{background-image:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0))!important}
/* arrasto mais suave */
.wghost{transform:scale(1.02);box-shadow:0 24px 60px rgba(0,0,0,.16)!important;opacity:.98;transition:transform .35s var(--apple),box-shadow .35s}
.w-placeholder{outline:1.5px dashed color-mix(in srgb,var(--ink) 18%,transparent)!important;outline-offset:-1px;background:color-mix(in srgb,var(--ink) 3%,transparent)!important;transition:background .3s}
.wguides i{background:color-mix(in srgb,var(--accent) 3%,transparent);border:1px dashed color-mix(in srgb,var(--accent) 18%,transparent)}
.wguides{animation:fadein .25s var(--apple)}
@keyframes fadein{from{opacity:0}}
.w.resizing{outline:1.5px solid color-mix(in srgb,var(--accent) 70%,transparent)}
.wsize-badge{animation:zoom .3s var(--apple)}
/* abrir e fechar como app da Apple: cresce a partir de onde você clicou */
.overlay{animation:ovIn .45s var(--apple) both;background:rgba(0,0,0,.18)}
@keyframes ovIn{from{background:rgba(0,0,0,0);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}}
.modal.app-open,.drawer.app-open{animation:appOpen .55s var(--apple) both}
@keyframes appOpen{0%{transform:scale(.18);opacity:0;border-radius:40px;filter:blur(4px)}55%{opacity:1;filter:blur(0)}100%{transform:none;opacity:1}}
.modal.app-swap,.drawer.app-swap{animation:appSwap .35s var(--apple) both}
@keyframes appSwap{from{opacity:.4;transform:scale(.985)}}
#layer.closing .overlay{animation:ovOut .3s var(--apple) forwards}
@keyframes ovOut{to{background:rgba(0,0,0,0);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}}
#layer.closing .modal,#layer.closing .drawer{animation:appClose .3s var(--apple) forwards}
@keyframes appClose{to{transform:scale(.6);opacity:0;filter:blur(3px)}}
/* troca de tela */
::view-transition-old(root){animation:vtOut .28s var(--apple) both}
::view-transition-new(root){animation:vtIn .45s var(--apple) both}
@keyframes vtOut{to{opacity:0;transform:scale(.99)}}
@keyframes vtIn{from{opacity:0;transform:scale(1.01)}}
#view.enter>*{animation:rise .55s var(--apple) both}
#view.enter .wgrid>.w{animation:rise .6s var(--apple) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.99)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v6: cores, simplicidade, notas e documentos, movimento ===== */
:root{--brand-tint:12%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand-tint:22%}}
:root[data-theme="dark"]{--brand-tint:22%}
/* ícones das áreas: cores do sistema Apple, degradê sutil sem escurecer */
.ti{background:linear-gradient(180deg,var(--a) 0%,var(--b) 100%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.35),0 .5px 1.5px rgba(0,0,0,.12)}
.ti svg.i{stroke:#fff}
.ti[style*="#FFD84D"] svg.i{stroke:#3A2E00}
/* apps de terceiros: fundo claro tingido e letra na cor da marca, sempre legível */
.logo,.gmark,.dock button,.appswitch button,.ti.brand{background:color-mix(in srgb,var(--c,#8E8E93) var(--brand-tint),var(--bg))!important;color:var(--c,#8E8E93)!important;background-image:none!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,#8E8E93) 18%,transparent)!important;font-weight:700;letter-spacing:-.02em}
.dock button[data-act=goapps]{box-shadow:none!important;background:transparent!important;color:var(--muted)!important}
.ti.brand b{color:var(--c)}
.tile.hl{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff) 0%,var(--accent) 100%);color:#fff}
.btn.primary{background:var(--ink)}
.btn.accent{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent))}
#syncBadge{display:none}
.top h1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.vsub{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:-.01em}
@media (max-width:1100px){.vsub{display:none}}
.nav-label.more{margin-top:14px}
.nav a.more{font-size:13px;color:var(--muted);padding:5px 10px}
.nav a.more .ti{width:22px;height:22px;border-radius:6px}
.nav a.more .ti svg.i{width:13px;height:13px}
/* foco compacto */
.focus{padding:10px 12px;gap:6px;border-radius:14px}
.focus-top{display:none}
.focus-time{font-size:20px}
.focus select{font-size:11px;padding:4px 6px}
.focus .btn{padding:6px 10px;font-size:12px}
/* comece por aqui */
.guide{background:var(--tile);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.guide-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.guide-h strong{font-size:16px}
.guide-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.guide-steps button{border:0;background:var(--bg);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:transform .35s var(--apple),box-shadow .3s}
.guide-steps button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.guide-steps b{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;margin-bottom:6px}
.guide-steps span{font-size:13px;color:var(--muted)}
@media (max-width:760px){.guide-steps{grid-template-columns:1fr}}
/* abas de notas e ideias */
.tabs-line{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--hair);overflow-x:auto}
.tabs-line button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s,border-color .25s var(--apple)}
.tabs-line button.on{color:var(--ink);border-bottom-color:var(--ink)}
.in-notas>.toolbar:first-child .seg{display:none}
/* notas estilo Apple Notes */
.notes-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.newnote{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--tile);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;transition:transform .35s var(--apple)}
.newnote:hover{transform:translateY(-1px)}
.note{cursor:text;border:0!important;padding:16px 16px 10px;border-radius:18px}
.note .pinbtn{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--muted);opacity:0;padding:6px;border-radius:8px;transition:opacity .2s}
.note .pinbtn.on{opacity:1;color:var(--accent)}
.note:hover .pinbtn{opacity:1}
.n-title{font-weight:700;font-size:16px;letter-spacing:-.02em;outline:none;margin-right:26px;min-height:22px}
.n-body{outline:none;font-size:14px;line-height:1.55;margin-top:6px;min-height:40px;white-space:pre-wrap}
.n-title:empty:before,.n-body:empty:before,.n-item span:empty:before{content:attr(data-ph);color:var(--muted);opacity:.7}
.n-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.n-item{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.n-item .check{width:17px;height:17px;margin-top:2px}
.n-item span{flex:1;outline:none;min-height:20px}
.n-item.ok span{text-decoration:line-through;color:var(--muted)}
.n-add{border:0;background:none;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:2px 0;align-self:flex-start}
.n-add svg.i{width:14px;height:14px}
.note .nb{display:flex;align-items:center;gap:2px;margin-top:10px;opacity:0;transition:opacity .2s}
.note:hover .nb,.note:focus-within .nb{opacity:1}
.note .sw{width:14px;height:14px}
.emptybig{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:28px;background:var(--tile);border-radius:var(--r);max-width:520px}
.emptybig strong{font-size:16px}
.emptybig span{color:var(--muted);font-size:14px}
.mini-notes{display:block;columns:3 220px;column-gap:12px}
.mini-notes .note{margin-bottom:12px}
/* documentos estilo Notion */
.docs2{display:grid;grid-template-columns:240px 1fr;gap:20px;min-height:calc(100vh - 150px)}
.doclist2{display:flex;flex-direction:column;gap:12px;position:sticky;top:0;align-self:start;max-height:calc(100vh - 140px);overflow:auto;padding-right:4px}
.doclist2 .input{padding:8px 12px;background:var(--tile);border:0}
.page{background:var(--bg);border-radius:var(--r);box-shadow:0 0 0 1px var(--hair);min-width:0;display:flex;flex-direction:column}
.pagebar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--hair)}
.page-in{max-width:740px;width:100%;margin:0 auto;padding:48px 28px 160px}
.doctitle2{border:0;outline:none;background:none;font-size:40px;font-weight:700;letter-spacing:-.04em;width:100%;padding:0;margin-bottom:10px;line-height:1.1}
.doctitle2::placeholder{color:var(--muted);opacity:.5}
.docmeta2{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:28px}
.docmeta2 select{border:0;background:var(--tile);border-radius:8px;padding:4px 8px;margin-left:6px;font-size:13px;color:var(--ink)}
.editor2{outline:none;font-size:17px;line-height:1.7;letter-spacing:-.012em;min-height:300px}
.editor2>*{margin:0 0 6px;padding:2px 0;border-radius:6px;position:relative}
.editor2 h2{font-size:27px;letter-spacing:-.03em;margin:28px 0 8px;line-height:1.25}
.editor2 h3{font-size:20px;letter-spacing:-.02em;margin:20px 0 6px}
.editor2 ul,.editor2 ol{padding-left:24px}
.editor2 blockquote{border-left:3px solid var(--accent);padding:4px 16px;background:none;color:var(--ink)}
.editor2 hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.editor2 table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:15px}
.editor2 td,.editor2 th{border:1px solid var(--line);padding:8px 10px;text-align:left}
.editor2 th{background:var(--tile);font-weight:600}
.editor2 .todo{list-style:none;padding-left:0}
.editor2 .todo li{display:flex;gap:10px;align-items:flex-start;padding-left:0}
.editor2 .todo li:before{content:"";width:16px;height:16px;border:1.5px solid var(--muted);border-radius:5px;margin-top:6px;flex:none;cursor:pointer}
.editor2 .todo li.ok:before{background:var(--accent);border-color:var(--accent)}
.editor2 .todo li.ok{color:var(--muted);text-decoration:line-through}
.editor2 [data-empty]:before{content:"Escreva, ou digite / para inserir título, lista, checklist, tabela…";color:var(--muted);opacity:.6;pointer-events:none;position:absolute}
.editor2 h2[data-empty]:before{content:"Título"}
.editor2 h3[data-empty]:before{content:"Subtítulo"}
.slash{position:fixed;z-index:60;width:260px;max-height:320px;overflow:auto;background:var(--bg);border-radius:14px;box-shadow:0 0 0 1px var(--hair),0 16px 40px rgba(0,0,0,.14);padding:6px;animation:zoom .25s var(--apple);transform-origin:top left}
.slash button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px}
.slash button strong{font-size:14px}
.slash button span{font-size:12px;color:var(--muted)}
.slash button.on,.slash button:hover{background:var(--tile)}
.seltool{position:fixed;z-index:60;transform:translate(-50%,-100%);display:flex;gap:2px;background:#1D1D1F;color:#fff;border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:zoom .2s var(--apple)}
.seltool button{border:0;background:none;color:#fff;font-size:13px;font-weight:600;padding:6px 9px;border-radius:7px}
.seltool button:hover{background:rgba(255,255,255,.14)}
@media (max-width:860px){.docs2{grid-template-columns:1fr}.doclist2{position:static;max-height:220px}.page-in{padding:28px 18px 100px}.doctitle2{font-size:30px}}
/* movimento dos blocos */
.w-lifted{opacity:.35;transition:opacity .25s var(--apple)}
.wghost{position:fixed!important;z-index:90;pointer-events:none;margin:0;border-radius:var(--r);background:var(--tile);transform-origin:center;transition:box-shadow .35s var(--apple);will-change:transform;opacity:1}
.wghost.up{box-shadow:0 30px 70px rgba(0,0,0,.18)!important}
.wdrop{position:absolute;left:0;top:0;width:4px;border-radius:4px;background:var(--accent);z-index:6;pointer-events:none;transition:transform .28s var(--apple),height .28s var(--apple);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.wpreview{position:absolute;z-index:6;pointer-events:none;border-radius:var(--r);border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent);transition:width .22s var(--apple),height .22s var(--apple)}
.wpreview .wsize-badge{bottom:12px}
.w.resizing{outline:none}
::view-transition-group(*){animation-duration:.55s;animation-timing-function:cubic-bezier(.32,.72,0,1)}
::view-transition-old(*),::view-transition-new(*){height:100%;width:100%;object-fit:none;object-position:0 0;animation-duration:.4s}
::view-transition-image-pair(*){overflow:hidden;border-radius:22px}
::view-transition-image-pair(root){overflow:visible;border-radius:0}
::view-transition-old(root),::view-transition-new(root){object-fit:fill;height:auto}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wgrid>.w{z-index:1}
.wguides{z-index:0}
.banner{background:#1D1D1F!important;color:#F5F5F7}
:root{--n-branco:#F5F5F7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--n-branco:#1C1C1E}}
:root[data-theme="dark"]{--n-branco:#1C1C1E}
/* troca de tela: só um fade curto, sem tremer */
#view.enter>*{animation:viewFade .22s ease-out both!important}
#view.enter .wgrid>.w{animation:none!important}
@keyframes viewFade{from{opacity:0}to{opacity:1}}
.msg.pending{opacity:.6;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* gaveta do projeto: estilo Ajustes da Apple */
.pd{width:min(500px,100%)}
.pd-h{border-bottom:0;padding:14px 18px 6px}
.pd-kicker{font-size:13px;color:var(--muted);font-weight:500}
.pd-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-right:4px}
.pd-b{padding:4px 22px 28px;gap:26px}
.pd-title{font-size:26px!important;font-weight:700;letter-spacing:-.02em;border:0!important;padding:0!important;background:transparent!important;width:100%}
.pd-meta{font-size:13px;color:var(--muted);margin-top:4px}
.pd-stepper{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding-top:2px}
.pd-track{position:absolute;left:calc(100%/var(--n)/2);right:calc(100%/var(--n)/2);top:9px;height:2px;border-radius:2px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.pd-track i{position:absolute;inset:0 auto 0 0;width:calc(100% * var(--i) / (var(--n) - 1));background:var(--ink);border-radius:2px;transition:width .35s var(--ease,ease)}

.pd-step.past .pd-dot{background:var(--ink);box-shadow:none}

a.pd-row:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}

.gpick{width:min(560px,94vw)}.gpick-list{margin-top:12px;max-height:52vh;overflow:auto;border-radius:12px;background:color-mix(in srgb,var(--ink) 4%,var(--surface))}

function wFin(){const sum=a=>a.reduce((x,y)=>x+y.amount,0);const ms=[5,4,3,2,1,0].map(k=>{const m=new Date(T0.getFullYear(),T0.getMonth()-k,1);return {l:MESES[m.getMonth()],v:sum(S.fin.filter(f=>{const x=parse(f.date);return f.type==='in'&&f.status==='pago'&&x.getMonth()===m.getMonth()&&x.getFullYear()===m.getFullYear()})),cur:k===0}});const mx=Math.max(...ms.map(m=>m.v))||1;
